import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fheroes2'

    compileSdk 35

    defaultConfig {
        applicationId 'org.fheroes2'

        minSdk 22
        targetSdk 35

        // These paths are set relative to the android project directory
        versionCode((new File('../version_code.txt')).getText('UTF-8').trim().toInteger())
        versionName((new File('../version.txt')).getText('UTF-8').trim())

        externalNativeBuild {
            ndkBuild {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                arguments '-j4'
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    signingConfigs {
        release {
            storeFile({
                def keystorePath = System.getenv('FHEROES2_KEYSTORE')

                return keystorePath ? file(keystorePath) : null
            }.call())

            storePassword({
                def keystorePass = System.getenv('FHEROES2_KEYSTORE_PASSWORD')

                return keystorePass ? keystorePass : ''
            }.call())

            keyAlias({
                def keyAlias = System.getenv('FHEROES2_KEY_ALIAS')

                return keyAlias ? keyAlias : ''
            }.call())

            keyPassword({
                def keyPass = System.getenv('FHEROES2_KEY_PASSWORD')

                return keyPass ? keyPass : ''
            }.call())
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                ndkBuild {
                    cFlags '-DWITH_DEBUG', '-Werror'
                }
            }
        }

        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    implementation project(':isotools')
    implementation project(':sdl2')

    implementation group: 'commons-io', name: 'commons-io', version: '2.20.0'

    implementation 'org.tukaani:xz:1.10'

    implementation 'com.google.android.material:material:1.13.0'
}

tasks.register('copyFH2M', Copy) {
    from('../../maps') {
        include '*.fh2m'
    }
    into 'src/main/assets/maps'
}

tasks.register('copyH2D', Copy) {
    from('../../files/data') {
        include '*.h2d'
    }
    into 'src/main/assets/files/data'
}

tasks.register('copyTimidity', Copy) {
    from('../../files/timidity') {
        include 'instruments/*.pat'
        include 'timidity.cfg'
    }
    into 'src/main/assets/files/timidity'
}

tasks.register('copyTranslations', Copy) {
    from('../../files/lang') {
        include '*.mo'
    }
    into 'src/main/assets/files/lang'
}

// Computes the identity of the game sources used by network games, the same way as script/windows/generate_source_id.ps1.
// The .cpp and .h files are sorted by path, "path \n content without \r \n" of each file is hashed with SHA-256 and
// the first 16 hexadecimal digits are kept.
tasks.register('generateMultiSourceId') {
    final File rootDir = file('../..')
    final File header = file("${layout.buildDirectory.get().asFile}/generated/multi/multi_source_id.h")

    outputs.upToDateWhen { false }

    doLast {
        final List<String> paths = []
        ['src/engine', 'src/fheroes2'].each { dir ->
            fileTree(new File(rootDir, dir)).matching { include '**/*.cpp', '**/*.h' }.each {
                paths.add(rootDir.toPath().relativize(it.toPath()).toString().replace('\\', '/'))
            }
        }
        paths.sort()

        final MessageDigest sha = MessageDigest.getInstance('SHA-256')
        paths.each { path ->
            sha.update(path.getBytes('UTF-8'))
            sha.update((byte) 10)

            final byte[] content = new File(rootDir, path).bytes
            final ByteArrayOutputStream withoutReturns = new ByteArrayOutputStream(content.length)
            for (final byte b : content) {
                if (b != (byte) 13) {
                    withoutReturns.write(b)
                }
            }
            sha.update(withoutReturns.toByteArray())
            sha.update((byte) 10)
        }

        final byte[] digest = sha.digest()
        final String id = (0..7).collect { String.format('%02x', digest[it]) }.join()
        final String text = "// Generated by android/app/build.gradle: identity of the game sources.\n#pragma once\n#define MULTI_SOURCE_ID 0x${id}ULL\n"

        if (!header.exists() || header.text != text) {
            header.parentFile.mkdirs()
            header.text = text
        }

        println "Source identity: ${id}"
    }
}

tasks.named('preBuild') {
    dependsOn generateMultiSourceId
}

tasks.register('generateAssetsDigest') {
    dependsOn copyFH2M, copyH2D, copyTimidity, copyTranslations

    doLast {
        final java.nio.file.Path assetsDirPath = layout.projectDirectory.getAsFile()
                .toPath().resolve('src/main/assets')
        final java.nio.file.Path digestPath = assetsDirPath.resolve('assets.digest')
        final boolean isDigestExists = Files.exists(digestPath)

        final StringBuilder sb = new StringBuilder()

        fileTree(dir: assetsDirPath).each {
            final java.nio.file.Path itPath = it.toPath()
            if (isDigestExists && Files.isSameFile(itPath, digestPath)) {
                return
            }

            final byte[] itBuf = Files.readAllBytes(itPath)

            sb.append(String.format('%0128x % 12d %s\n',
                    new BigInteger(1, MessageDigest.getInstance('SHA-512').digest(itBuf)),
                    itBuf.length, assetsDirPath.relativize(itPath)))
        }

        Files.write(digestPath, sb.toString().getBytes('UTF-8'))
    }
}

preBuild {
    dependsOn generateAssetsDigest
}
